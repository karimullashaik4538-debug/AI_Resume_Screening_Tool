<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Screening Tool - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>AI Resume Screening Tool</h1>

        <p class="subtitle">
            Login to continue
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                >

            </div>

            <p
                id="loginMessage"
                class="message"
            ></p>

            <button
                type="submit"
                class="btn"
            >
                Login
            </button>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
