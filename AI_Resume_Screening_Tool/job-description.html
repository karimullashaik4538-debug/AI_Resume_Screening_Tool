<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI Resume Screening Tool - Job Description
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        AI Resume Screening Tool
    </div>

    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="job-description.html">
            Job Description
        </a>

        <a href="resume-upload.html">
            Resume Upload
        </a>

        <a href="results.html">
            Results
        </a>

    </div>

</nav>

<main class="form-container">

    <div class="form-box">

        <h1>
            Job Description
        </h1>

        <p class="subtitle">
            Enter the requirements for the job.
        </p>

        <form id="jobDescriptionForm">

            <div class="form-group">

                <label for="jobTitle">
                    Job Title
                </label>

                <input
                    type="text"
                    id="jobTitle"
                    placeholder="Example: Frontend Developer"
                >

            </div>

            <div class="form-group">

                <label for="jobDescription">
                    Job Description
                </label>

                <textarea
                    id="jobDescription"
                    rows="6"
                    placeholder="Enter job description"
                ></textarea>

            </div>

            <div class="form-group">

                <label for="requiredSkills">
                    Required Skills
                </label>

                <input
                    type="text"
                    id="requiredSkills"
                    placeholder="Python, HTML, CSS, React"
                >

            </div>

            <p
                id="jobMessage"
                class="message"
            ></p>

            <button
                type="submit"
                class="btn"
            >
                Save & Continue
            </button>

        </form>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
