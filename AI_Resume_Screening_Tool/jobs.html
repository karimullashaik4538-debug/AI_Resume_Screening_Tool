<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs Management</title>
    <link rel="stylesheet" href="member3_frontend.css">
</head>

<body>

    <nav class="navbar">
        <h2>AI Resume Screening Tool</h2>

        <div>
            <a href="dashboard-member3.html">Dashboard</a>
            <a href="jobs.html">Jobs</a>
            <a href="candidates.html">Candidates</a>
            <a href="results-member3.html">Results</a>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">

        <h1>Job Management</h1>

        <form id="jobForm">

            <div class="form-group">
                <label for="jobTitle">Job Title</label>
                <input type="text" id="jobTitle" placeholder="Enter job title">
            </div>

            <div class="form-group">
                <label for="jobDescription">Job Description</label>
                <textarea id="jobDescription" placeholder="Enter job description"></textarea>
            </div>

            <div class="form-group">
                <label for="requiredSkills">Required Skills</label>
                <input type="text" id="requiredSkills" placeholder="Example: Python, Flask, SQL">
            </div>

            <button type="submit">Add Job</button>

        </form>

        <h2>Job List</h2>

        <div id="jobList">

            <div class="job-item">
                <h3>Frontend Developer</h3>
                <p><strong>Description:</strong> Develop and maintain web applications.</p>
                <p><strong>Required Skills:</strong> HTML, CSS, JavaScript</p>
                <button onclick="deleteJob(this)">Delete</button>
            </div>

        </div>

    </div>

    <script src="member3_frontend.js"></script>

</body>
</html>
